<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circuito do Rebite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--mono:'JetBrains Mono','DejaVu Sans Mono','Liberation Mono',monospace;--disp:'Chakra Petch','Arial Narrow','DejaVu Sans Condensed',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020608;overflow:hidden}
body.kiosk,body.kiosk *{cursor:none!important}

#stage{position:absolute;left:50%;top:50%;width:800px;height:480px;margin:-240px 0 0 -400px;
  transform-origin:50% 50%;overflow:hidden;background:#07181a;font-family:var(--mono);
  user-select:none;-webkit-user-select:none;touch-action:none}
#stage>*{position:absolute}
.layer{left:0;top:0;width:800px;height:480px;overflow:visible}

/* ---------- placa ---------- */
#pcb{z-index:0;pointer-events:none}
.tr{fill:none;stroke:#134f48;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pu{fill:none;stroke:#5cf5d2;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:10 120;animation:flow 3s linear infinite;opacity:.85}
.pu.am{stroke:#ffc857}
@keyframes flow{to{stroke-dashoffset:-130}}
#stage.night .pu{animation-duration:9s;opacity:.35}
.silk{font:500 9px var(--mono);fill:#8fd1c4;opacity:.38}
.dled{animation:dl 2.4s steps(2) infinite}
@keyframes dl{50%{opacity:.15}}

#ground{left:0;top:440px;width:800px;height:40px;z-index:5;background:#070d10;border-top:2px solid #21423f}
#ground .bus{position:absolute;left:0;right:0;height:2px;background:#164a43}
#ground .bus.b1{top:8px}#ground .bus.b2{top:14px}#ground .bus.b3{top:20px}
#ground .bus::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 90px,#5cf5d2 90px 104px);background-size:200px 100%;animation:busm 4s linear infinite;opacity:.8}
#ground .b2::after{animation-duration:6s;background:repeating-linear-gradient(90deg,transparent 0 120px,#ffc857 120px 130px)}
@keyframes busm{to{background-position:200px 0}}
#ground .pins{position:absolute;left:0;right:0;top:26px;bottom:0;background:repeating-linear-gradient(90deg,#c9a24a 0 8px,#0a1114 8px 12px)}

/* aquecedor (resistor) e ventilador (cooler) */
#heater{z-index:9}
#heater .glow,#heater .waves{opacity:0}
#heater.on .glow{opacity:1;animation:hp 1s ease-in-out infinite alternate}
#heater.on .waves{opacity:1}
#heater.on .rbody{fill:#ffb36b}
#heater .waves path{animation:wv 1.2s linear infinite}
#heater .waves path:nth-child(2){animation-delay:.4s}#heater .waves path:nth-child(3){animation-delay:.8s}
@keyframes hp{from{opacity:.5}to{opacity:1}}
@keyframes wv{0%{transform:translateY(4px);opacity:0}40%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
#fan{z-index:9}
#fan #blades{transform-origin:22px 22px}
#fan.on #blades{animation:spin .22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fan #wind path{opacity:0}
#fan.on #wind path{animation:wind .9s linear infinite}
#fan.on #wind path:nth-child(2){animation-delay:.3s}
#fan.on #wind path:nth-child(3){animation-delay:.6s}
@keyframes wind{0%{transform:translateX(8px);opacity:0}30%{opacity:.85}100%{transform:translateX(-24px);opacity:0}}
#fanLed{fill:#a33}
#fan.on #fanLed{fill:#4be07b}

/* ---------- módulos (cards) ---------- */
#cards{inset:0;z-index:10;pointer-events:none}
.card{position:absolute;left:0;top:0;width:208px;height:120px;border-radius:6px;transform-origin:50% 100%;pointer-events:auto;
  background:linear-gradient(#1d262d,#10161b);box-shadow:inset 0 0 0 1px #2d3a43,0 3px 0 rgba(0,0,0,.4)}
.card::before,.card::after{content:"";position:absolute;top:18px;bottom:18px;width:6px;
  background:repeating-linear-gradient(180deg,#c9a24a 0 7px,transparent 7px 13px)}
.card::before{left:-6px;border-radius:2px 0 0 2px}
.card::after{right:-6px;border-radius:0 2px 2px 0}
.strip{position:absolute;left:0;right:0;top:0;height:5px;border-radius:6px 6px 0 0;background:var(--a)}
.tag{position:absolute;left:12px;top:9px;font:700 10px/1 var(--mono);color:var(--a);letter-spacing:.04em}
.led{position:absolute;top:10px;width:6px;height:6px;border-radius:50%}
.led.g{right:34px;background:#37d67a;box-shadow:0 0 5px #37d67a}
.led.a{right:23px;background:#ffb347;animation:act 1.3s steps(2) infinite}
.led.r{right:12px;background:#3a2323}
@keyframes act{50%{opacity:.2}}
.card[data-d] .led.g{background:#27382f;box-shadow:none}
.card[data-d] .led.r{background:#ff3b30;box-shadow:0 0 6px #ff3b30;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.plate{position:absolute;left:12px;right:12px;top:22px;height:74px;border-radius:4px;background:#050a0d;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.lab{position:absolute;left:10px;top:5px;font:500 11px/1 var(--mono);color:var(--a)}
.val{position:absolute;left:10px;top:14px;white-space:nowrap;font:700 42px/1 var(--disp);color:#eef7f5}
.sub{position:absolute;left:10px;bottom:5px;white-space:nowrap;font:500 12px/1 var(--mono);color:#a9bdbb}
.up{color:#63d98f}.down{color:#ff7b6b}
.ico{position:absolute;right:10px;top:16px;width:38px;height:38px}
.ico svg{width:38px;height:38px;display:none}
.ico.sol .s-sol,.ico.nublado .s-nub,.ico.chuva .s-chu{display:block}
.rail{position:absolute;left:12px;right:12px;bottom:0;height:24px}
.code{position:absolute;left:0;top:6px;font:500 9px/1 var(--mono);color:#6f8a88;white-space:nowrap}
.vents{position:absolute;left:112px;top:5px;width:34px;height:12px;background:repeating-linear-gradient(90deg,#070b0e 0 3px,transparent 3px 6px);border-radius:2px}
.port{position:absolute;right:6px;top:5px;width:20px;height:11px;border-radius:3px;background:#070b0e;box-shadow:inset 0 0 0 1px #3b4a52}
.port::after{content:"";position:absolute;left:4px;right:4px;top:4px;height:3px;background:#c9a24a;border-radius:1px}
.sc{position:absolute;width:5px;height:5px;border-radius:50%;background:#3b4852;box-shadow:inset 0 0 0 1px #0a0f12}
.sc.a{left:4px;top:11px}.sc.b{right:4px;top:11px}.sc.c{left:4px;bottom:4px}.sc.d{right:4px;bottom:4px}
.colon{animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:.25}}
.rep{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12);display:none;z-index:3}
.rep i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--a)}
.card.fixing .rep{display:block}
.card.flash .plate{animation:fl .8s ease-out}
@keyframes fl{0%{background:#1b4a3a}100%{background:#050a0d}}

/* defeitos */
.fx{position:absolute;inset:0;pointer-events:none;display:none;z-index:2}
.card[data-d] .fx{display:block}
.fx>div{position:absolute;inset:0;display:none}
.card[data-d=glitch] .fxg,.card[data-d=heat] .fxh,.card[data-d=short] .fxs,.card[data-d=bsod] .fxb,.card[data-d=bug] .fxu{display:block}
.fxg i{position:absolute;left:0;right:0;height:7px;background:rgba(255,50,120,.55);mix-blend-mode:screen;animation:tear .9s steps(7) infinite}
.fxg i:nth-child(1){top:8px}.fxg i:nth-child(2){top:34px;background:rgba(0,230,255,.5);animation-delay:-.3s}.fxg i:nth-child(3){top:56px;height:4px;animation-delay:-.6s}
@keyframes tear{0%{transform:translateX(0)}20%{transform:translateX(-30px)}40%{transform:translateX(24px)}60%{transform:translateX(-8px)}80%{transform:translateX(40px)}100%{transform:translateX(0)}}
.card[data-d=glitch] .val,.card[data-d=glitch] .sub{animation:gj .3s steps(2) infinite;text-shadow:2px 0 #ff2a6d,-2px 0 #00e5ff}
@keyframes gj{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}}
.fxh{background:radial-gradient(ellipse at 50% 110%,rgba(255,60,30,.6),transparent 70%)}
.fxh b{position:absolute;right:8px;top:6px;font:700 13px var(--mono);color:#ffd0c8;animation:blink .6s steps(2) infinite}
.card[data-d=heat]{animation:hglow .9s ease-in-out infinite alternate}
.card[data-d=heat] .plate{animation:shake .12s linear infinite}
@keyframes hglow{from{box-shadow:inset 0 0 0 1px #5b2a24,0 0 10px 1px rgba(255,70,40,.4),0 3px 0 rgba(0,0,0,.4)}to{box-shadow:inset 0 0 0 1px #8a3a30,0 0 26px 5px rgba(255,70,40,.7),0 3px 0 rgba(0,0,0,.4)}}
@keyframes shake{0%{transform:translate(0,0)}33%{transform:translate(1.5px,-1px)}66%{transform:translate(-1.5px,1px)}100%{transform:translate(0,0)}}
.fxs{background:rgba(0,0,0,.4)}
.fxs b{position:absolute;left:10px;top:8px;font:700 14px var(--mono);color:#ffd84a;animation:blink .35s steps(2) infinite}
.card[data-d=short] .plate{animation:fl2 .7s steps(1) infinite}
@keyframes fl2{0%{opacity:1}30%{opacity:.25}40%{opacity:1}70%{opacity:.5}80%{opacity:1}}
.fxb{background:#0b46c8;color:#fff;padding:8px 10px}
.fxb .face{font:700 28px/1 var(--disp)}
.fxb .msg{font:500 10px/1.35 var(--mono);margin-top:3px}
.fxu svg{position:absolute;left:0;top:22px;width:22px;height:22px;animation:crawl 4.5s linear infinite}
@keyframes crawl{0%{transform:translateX(8px)}50%{transform:translateX(158px)}50.1%{transform:translateX(158px) scaleX(-1)}100%{transform:translateX(8px) scaleX(-1)}}
.fxu b{position:absolute;left:10px;bottom:5px;font:700 10px var(--mono);color:#ff8c7a}
.card[data-d=bug] .val{opacity:.5}
.card.ok .plate::before{content:"✔ OK";position:absolute;inset:0;z-index:5;background:rgba(18,84,52,.92);color:#8dffbb;
  font:700 30px var(--disp);display:flex;align-items:center;justify-content:center;animation:okf 1.3s forwards}
@keyframes okf{0%{opacity:1}65%{opacity:1}100%{opacity:0}}

/* robô */
#craneSvg{z-index:15;pointer-events:none}
#workSvg{z-index:22;pointer-events:none}
#botSvg{z-index:20}
.skin-astro{--leg:#e9eef2;--boot:#b9c4ce;--glove:#dbe3ea;--joint:#8e9aa6;--body:#f4f7fa;--body2:#cdd7df;--acc:#3a9bff}
.skin-titan{--leg:#3b434b;--boot:#14171b;--glove:#2a3037;--joint:#c4ccd3;--body:#2e353c;--body2:#1d2227;--acc:#eaf2f7}
.skin-rebite{--leg:#4a5864;--boot:#222b33;--glove:#e6b52a;--joint:#9db0bc;--body:#f0b429;--body2:#4a5864;--acc:#f4f6f7}
.kl{fill:var(--leg)}.kb{fill:var(--boot)}.kg{fill:var(--glove)}.kj{fill:var(--joint);stroke:rgba(0,0,0,.35);stroke-width:.6}
.kbd{fill:var(--body)}.kb2{fill:var(--body2)}.kac{fill:var(--acc)}.karm{fill:var(--leg)}
.skin-rebite .karm{fill:#9db0bc}
.v-r,.v-a,.v-t{display:none}
.skin-rebite .v-r,.skin-astro .v-a,.skin-titan .v-t{display:inline}
#zzz text{font:700 12px var(--mono);fill:#cfe4ff;opacity:0;animation:zf 2.2s linear infinite}
#zzz text:nth-child(2){animation-delay:.7s}#zzz text:nth-child(3){animation-delay:1.4s}
@keyframes zf{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(8px,-18px)}}
#battFill{animation:chg 2.4s ease-in-out infinite}
@keyframes chg{from{width:2px}to{width:14px}}

#bubble{z-index:30;left:0;top:0;background:#e9f5f2;color:#0d1f22;font:700 13px/1.1 var(--mono);
  padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#e9f5f2;border-bottom:0}
#bubble.on{opacity:1}
#fxc{left:0;top:0;z-index:35;pointer-events:none}
#dim{inset:0;z-index:40;background:#000;opacity:0;pointer-events:none}

/* monitor do Pi (chip da CPU) e aba Sistema */
.pit{font:700 8px var(--mono);fill:#7fbfb4}
.pil{font:500 9px var(--mono);fill:#8fb8b0}
.piv{font:700 13px var(--mono);fill:#eaf7f4}
.pif{font:500 7.5px var(--mono);fill:#6f9c94}
#cpuGlow{animation:cg 1s ease-in-out infinite alternate}
@keyframes cg{from{stroke-opacity:.35}to{stroke-opacity:1}}
.sys{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:4px}
.sys div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid #15282c;padding:8px 0}
.sys span{color:#9fc6bf;font:500 13px var(--mono)}
.sys b{font:700 15px var(--mono);text-align:right}
/* setup */
#gear{right:8px;top:22px;z-index:50;width:30px;height:30px;border:0;border-radius:15px;background:rgba(0,0,0,.45);color:#cfe;font-size:16px;line-height:30px;padding:0;opacity:.5}
#panel{left:110px;top:24px;width:580px;height:432px;z-index:60;background:rgba(5,13,16,.97);border:1px solid #2a5a56;border-radius:10px;
  padding:12px 14px;display:flex;flex-direction:column;gap:7px;color:#e6f3f0;font:600 15px var(--disp)}
#panel[hidden]{display:none}
#panel .tabs{display:flex;gap:6px;margin-bottom:2px}
#panel button{font:600 14px var(--disp);color:#e6f3f0;background:#1b2b31;border:1px solid #2c4850;border-radius:6px;min-height:36px;padding:0 12px}
#panel button:active{background:#2c4850}
#panel button.on{background:#17624f;border-color:#3fd0a0}
#panel .tabs .sp{flex:1}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;border-bottom:1px solid #15282c;padding-bottom:5px}
#panel .row label{font-size:15px;color:#bfe0da}
#panel .grp{display:flex;gap:5px;align-items:center}
#panel .tv{min-width:34px;text-align:center;font:700 22px var(--mono)}
#panel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#panel .note{font:500 11px var(--mono);color:#7da7a1}
#panel .pad{flex:1}
</style>
</head>
<body>
<div id="stage">
  <svg id="pcb" class="layer" viewBox="0 0 800 480"></svg>
  <div id="ground"><i class="bus b1"></i><i class="bus b2"></i><i class="bus b3"></i><i class="pins"></i></div>

  <svg id="heater" width="48" height="46" viewBox="0 0 48 46" style="left:12px;top:424px;overflow:visible">
    <ellipse class="glow" cx="24" cy="26" rx="30" ry="20" fill="#ff7a2a" opacity=".35"/>
    <g class="waves" stroke="#ffb36b" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M12 8 q-3 -4 0 -8"/><path d="M24 6 q-3 -4 0 -8"/><path d="M36 8 q-3 -4 0 -8"/>
    </g>
    <path d="M0 28h8M40 28h8" stroke="#b9bec4" stroke-width="2"/>
    <rect class="rbody" x="7" y="17" width="34" height="22" rx="10" fill="#d9c9a0" stroke="#8a7a55" stroke-width="1.5"/>
    <rect x="14" y="17" width="3.5" height="22" fill="#7a2f1f"/><rect x="21" y="17" width="3.5" height="22" fill="#1a1a1a"/><rect x="28" y="17" width="3.5" height="22" fill="#c9962b"/>
    <rect x="9" y="39" width="8" height="6" rx="1" fill="#3b4652"/><rect x="31" y="39" width="8" height="6" rx="1" fill="#3b4652"/>
  </svg>

  <svg id="fan" width="44" height="66" viewBox="0 0 44 66" style="left:750px;top:404px;overflow:visible">
    <g id="wind" stroke="#cfe6f5" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M2 10h-12"/><path d="M0 22h-14"/><path d="M2 34h-12"/>
    </g>
    <rect x="11" y="60" width="22" height="5" rx="2.5" fill="#3b4652"/>
    <rect x="20" y="42" width="4" height="19" fill="#56636f"/>
    <circle id="fanLed" cx="22" cy="52" r="3.2" stroke="#222" stroke-width="1"/>
    <rect x="2" y="2" width="40" height="40" rx="6" fill="#161e24" stroke="#5b6b78" stroke-width="2"/>
    <circle cx="22" cy="22" r="16" fill="#0b1014" stroke="#33414b"/>
    <g id="blades" fill="#9fb2c0">
      <ellipse cx="22" cy="11" rx="3.6" ry="8"/>
      <ellipse cx="22" cy="11" rx="3.6" ry="8" transform="rotate(72 22 22)"/>
      <ellipse cx="22" cy="11" rx="3.6" ry="8" transform="rotate(144 22 22)"/>
      <ellipse cx="22" cy="11" rx="3.6" ry="8" transform="rotate(216 22 22)"/>
      <ellipse cx="22" cy="11" rx="3.6" ry="8" transform="rotate(288 22 22)"/>
    </g>
    <circle cx="22" cy="22" r="4" fill="#56636f"/>
    <circle cx="6" cy="6" r="1.6" fill="#3b4852"/><circle cx="38" cy="6" r="1.6" fill="#3b4852"/><circle cx="6" cy="38" r="1.6" fill="#3b4852"/><circle cx="38" cy="38" r="1.6" fill="#3b4852"/>
  </svg>

  <div id="cards"></div>

  <svg id="craneSvg" class="layer" viewBox="0 0 800 480">
    <rect x="0" y="6" width="800" height="8" fill="#e0a21a"/>
    <path d="M0 10h800" stroke="#7a5408" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="0" y="14" width="800" height="2" fill="#6b4a07"/>
    <line id="cable" x1="400" y1="14" x2="400" y2="26" stroke="#9fb2b8" stroke-width="2"/>
    <line id="sl1" stroke="#9fb2b8" stroke-width="1.6" visibility="hidden"/>
    <line id="sl2" stroke="#9fb2b8" stroke-width="1.6" visibility="hidden"/>
    <rect id="trolley" x="386" y="9" width="28" height="9" rx="2" fill="#2b333b"/>
    <rect id="spreader" x="358" y="26" width="84" height="6" rx="2" fill="#c7d3d8"/>
  </svg>

  <svg id="botSvg" class="layer skin-astro" viewBox="0 0 800 480" style="pointer-events:none">
    <g id="bRoot">
      <ellipse id="bShadow" cx="0" cy="1" rx="14" ry="3.2" fill="rgba(0,0,0,.35)"/>
      <g id="bRot">
        <g id="bFlip">
          <g id="bBody">
            <g id="legL"><rect class="kl" x="-3.2" y="0" width="6.4" height="13.5" rx="3"/><circle class="kj v-a v-t" cx="0" cy="6.5" r="3"/><rect class="kb" x="-3.8" y="10.5" width="10" height="6.5" rx="3"/></g>
            <g id="legR"><rect class="kl" x="-3.2" y="0" width="6.4" height="13.5" rx="3"/><circle class="kj v-a v-t" cx="0" cy="6.5" r="3"/><rect class="kb" x="-3.8" y="10.5" width="10" height="6.5" rx="3"/></g>

            <g class="v-r">
              <rect x="-12" y="-38" width="24" height="22" rx="7" fill="#f0b429"/>
              <rect x="-12" y="-31" width="24" height="3" fill="#f4f6f7" opacity=".92"/><rect x="-12" y="-25" width="24" height="3" fill="#f4f6f7" opacity=".92"/>
            </g>
            <g class="v-a">
              <rect class="kbd" x="-12.5" y="-39" width="25" height="23" rx="8"/>
              <rect class="kb2" x="-7.5" y="-34" width="15" height="10" rx="3"/>
              <circle class="kac" cx="0" cy="-29" r="2.2"/><circle class="kac" cx="0" cy="-29" r="4" opacity=".25"/>
              <circle class="kj" cx="-13" cy="-35" r="4.6"/><circle class="kj" cx="13" cy="-35" r="4.6"/>
            </g>
            <g class="v-t">
              <path class="kbd" d="M-12,-39 h24 l-2.5,23 h-19 z"/>
              <rect x="-9" y="-36" width="18" height="11" rx="2" fill="#aeb7bf"/>
              <rect x="-1" y="-33" width="2" height="6" fill="#1d2227"/><rect class="kb2" x="-7" y="-20" width="14" height="4" rx="1"/>
              <circle class="kj" cx="-13" cy="-35" r="4"/><circle class="kj" cx="13" cy="-35" r="4"/>
            </g>

            <g id="armL"><rect class="karm" x="-2.9" y="-1" width="5.8" height="15" rx="2.9"/><circle class="kj v-a v-t" cx="0" cy="7" r="2.8"/><circle class="kg" cx="0" cy="14.5" r="3.7"/>
              <g id="carryLap" visibility="hidden"><rect x="3" y="3" width="3.2" height="14" rx="1" fill="#aab4bd"/></g></g>

<script>
(()=>{
'use strict';
/* ============================ CONFIG ============================ */
const W=800,H=480,GY=468,BASE=448,CW=208,CH=120,JUMP_UP=150,JUMP_GAP=120,KS=1.12;
const Q=new URLSearchParams(location.search);
const REAL=Q.has('real');            // ?real=1     clima (Open-Meteo) e dólar (AwesomeAPI) reais
const KIOSK=Q.has('kiosk');          // ?kiosk=1    esconde o cursor e tenta tela cheia no primeiro toque
const SENSOR_URL=Q.get('sensors');   // ?sensors=http://localhost:8000/sensors   JSON {t,h,p}
const FAN_URL=Q.get('fan');          // ?fan=http://localhost:8000/fan           POST /on e /off
const LAT=-21.76, LON=-43.35;        // ajuste para a sua localização

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let dt=33, now=0, scale=1;
const stage=$('stage');
if(KIOSK) document.body.classList.add('kiosk');

/* configuração salva no navegador (setup) */
const CFG_KEY='rebite.cfg.v2';
const cfg=Object.assign({sleepOn:true,sleepStart:22*60,sleepEnd:6*60,skin:'astro',defects:2},(()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{};}catch(e){return {};}})());
if(Q.get('skin')) cfg.skin=Q.get('skin');
const saveCfg=()=>{ try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){} };

/* ============================ DADOS ============================ */
const IBOV0=128450, USD0=5.42;
const D={tOut:24,cond:'sol',rain:10,tmax:28,tmin:17,ibovPct:0.4,usdPct:-0.2,tRoom:23.4,hum:58,press:1012};
D.ibov=IBOV0*(1+D.ibovPct/100); D.usd=USD0*(1+D.usdPct/100);
const force={night:null,room:null};
const S={cold:false,hot:false,piHot:false,rain:false,night:false,nightness:0};
const fan={on:false};

function inSleepWindow(d){
  if(!cfg.sleepOn) return false;
  const m=d.getHours()*60+d.getMinutes(), a=cfg.sleepStart, b=cfg.sleepEnd;
  if(a===b) return false;
  return a<b ? (m>=a&&m<b) : (m>=a||m<b);
}
function updateState(){
  S.night = force.night===null ? inSleepWindow(new Date()) : force.night;
  if(!S.cold && D.tRoom<=18) S.cold=true; else if(S.cold && D.tRoom>=19.5) S.cold=false;
  if(!S.hot && D.tRoom>=28) S.hot=true; else if(S.hot && D.tRoom<=26.5) S.hot=false;
  S.rain = D.cond==='chuva';
}

/* ============================ MÓDULOS (CARDS) ============================ */
const slotCx=i=>166+234*i, homeX=i=>slotCx(i)-CW/2, homeY=k=>BASE-CH*(k+1);
const SVG_ICO='<div class="ico sol"><svg class="s-sol" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="#ffd34d"/><g stroke="#ffd34d" stroke-width="2.4" stroke-linecap="round"><path d="M16 3v4M16 25v4M3 16h4M25 16h4M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3"/></g></svg><svg class="s-nub" viewBox="0 0 32 32"><path d="M9 24a6 6 0 0 1 0-12 8 8 0 0 1 15 2 5 5 0 0 1-1 10z" fill="#c9d6df"/></svg><svg class="s-chu" viewBox="0 0 32 32"><path d="M9 20a6 6 0 0 1 0-11 8 8 0 0 1 15 2 5 5 0 0 1-1 9z" fill="#9fb1c0"/><g stroke="#6cb6ff" stroke-width="2.2" stroke-linecap="round"><path d="M11 24l-1.5 4M17 24l-1.5 4M23 24l-1.5 4"/></g></svg></div>';
const defs=[
 {id:'hora', label:'Hora',    a:'#4cc3ff', tag:'CLK-RTC',    code:'U1 · REV 2.1',    inner:'<div class="lab">hora local</div><div class="val">--:--</div><div class="sub">&nbsp;</div>'},
 {id:'clima',label:'Clima',   a:'#5ee6a8', tag:'ENV-API',    code:'U2 · OPEN-METEO', inner:'<div class="lab">clima</div><div class="val">--°</div>'+SVG_ICO+'<div class="sub">&nbsp;</div>'},
 {id:'bolsa',label:'Ibovespa',a:'#ffc857', tag:'MKT-IBOV',   code:'U3 · B3',         inner:'<div class="lab">ibovespa</div><div class="val">--</div><div class="sub">&nbsp;</div>'},
 {id:'dolar',label:'Dólar',   a:'#ff7a59', tag:'FX-USDBRL',  code:'U4 · FX',         inner:'<div class="lab">usd/brl</div><div class="val">--</div><div class="sub">&nbsp;</div>'},
 {id:'sala', label:'Sala',    a:'#b18cff', tag:'SNS-BME280', code:'U5 · I2C 0x76',   inner:'<div class="lab">sala</div><div class="val">--°</div><div class="sub">&nbsp;</div>'}
];
const BUG_SVG='<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="5" ry="7" fill="#ff5a5a"/><circle cx="12" cy="6" r="3" fill="#ff5a5a"/><g stroke="#ff5a5a" stroke-width="1.6" stroke-linecap="round"><path d="M7 10l-4-2M7 14l-4 0M7 18l-4 2M17 10l4-2M17 14l4 0M17 18l4 2M10 3l-2-2M14 3l2-2"/></g></svg>';
const cards=[], byId={};
defs.forEach(d=>{
  const el=document.createElement('div'); el.className='card'; el.style.setProperty('--a',d.a);
  el.innerHTML=`<i class="strip"></i><div class="tag">${d.tag}</div><i class="led g"></i><i class="led a"></i><i class="led r"></i>
  <div class="plate">${d.inner}
    <div class="fx"><div class="fxg"><i></i><i></i><i></i></div><div class="fxh"><b>⚠ 98°C</b></div><div class="fxs"><b>CURTO!</b></div>
      <div class="fxb"><div class="face">:(</div><div class="msg">ERRO 0x1A4F</div><div class="msg">Reiniciando… <span class="pc">0</span>%</div></div>
      <div class="fxu">${BUG_SVG}<b>NullPointerException</b></div></div>
    <div class="rep"><i></i></div></div>
  <div class="rail"><span class="code">${d.code}</span><span class="vents"></span><i class="port"></i></div>
  <i class="sc a"></i><i class="sc b"></i><i class="sc c"></i><i class="sc d"></i>`;
  $('cards').appendChild(el);
  const c={id:d.id,label:d.label,el,x:0,y:0,tx:0,ty:0,mode:'free',fx:0,bump:0,check:false,defect:null,fixing:false,rep:0};
  cards.push(c); byId[d.id]=c;
});
const cols=[[byId.hora,byId.clima],[byId.bolsa,byId.sala],[byId.dolar]];
function placeAll(init){ cols.forEach((col,i)=>col.forEach((c,k)=>{ c.tx=homeX(i); c.ty=homeY(k); if(init){c.x=c.tx;c.y=c.ty;} })); }
placeAll(true);
const isTop=c=>cols.some(col=>col.length&&col[col.length-1]===c);

const dias=['dom','seg','ter','qua','qui','sex','sáb'], meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmt=(n,d=0)=>n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const arrow=p=>p>=0?`<span class="up">▲ ${fmt(Math.abs(p),2)}%</span>`:`<span class="down">▼ ${fmt(Math.abs(p),2)}%</span>`;
let rendered=false;
function doFlash(c){ c.el.classList.remove('flash'); void c.el.offsetWidth; c.el.classList.add('flash'); }
function fitText(el){
  el.style.fontSize=''; const max=el.classList.contains('val')&&el.parentNode.querySelector('.ico')?112:162, w=el.offsetWidth;
  if(w>max) el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)*max/w).toFixed(1)+'px';
}
function put(c,sel,html,quiet){
  const el=c.el.querySelector(sel);
  if(el.innerHTML!==html){ el.innerHTML=html; fitText(el); if(rendered&&!quiet){ c.check=true; doFlash(c); } }
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>cards.forEach(c=>c.el.querySelectorAll('.val,.sub').forEach(fitText)));
function renderData(){
  put(byId.clima,'.val',`${Math.round(D.tOut)}°`);
  put(byId.clima,'.sub',`${Math.round(D.tmax)}° / ${Math.round(D.tmin)}° · chuva ${Math.round(D.rain)}%`);
  byId.clima.el.querySelector('.ico').className='ico '+D.cond;
  put(byId.bolsa,'.val',fmt(D.ibov)); put(byId.bolsa,'.sub',arrow(D.ibovPct));
  put(byId.dolar,'.val',`R$ ${fmt(D.usd,2)}`); put(byId.dolar,'.sub',arrow(D.usdPct));
  put(byId.sala,'.val',`${fmt(D.tRoom,1)}°`); put(byId.sala,'.sub',`${Math.round(D.hum)}% · ${Math.round(D.press)} hPa`);
  rendered=true;
}
function renderClock(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  put(byId.hora,'.val',`${p(d.getHours())}<span class="colon">:</span>${p(d.getMinutes())}`,true);
  put(byId.hora,'.sub',`${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]}`,true);
  const n=$('clockNote'); if(n) n.textContent=`Hora do sistema agora: ${p(d.getHours())}:${p(d.getMinutes())}. Se estiver errada, ajuste o fuso e o relógio do Pi.`;
}

/* ---- defeitos ---- */
const DEFKIND={glitch:'sw',bsod:'sw',bug:'sw',heat:'hw',short:'hw'};
const DEFNAME={glitch:'glitch',bsod:'tela azul',bug:'bug',heat:'superaquecimento',short:'curto-circuito'};
function setDefect(c,type){
  c.defect=type; c.rep=0; c.el.style.setProperty('--p',0);
  if(type) c.el.dataset.d=type; else c.el.removeAttribute('data-d');
}
function spawnDefect(type,card){
  const c=card||pick(cards.filter(x=>!x.defect&&x.mode!=='carried')); if(!c||c.defect) return;
  setDefect(c,type||pick(['glitch','glitch','bsod','bug','heat','short']));
  if(bot.low&&!S.night) setTask(think(),'think');
}
const DEF_BASE=[0,150000,75000,40000]; let defectT=12000;
function resetDefectTimer(first){ defectT=cfg.defects?(first?12000:DEF_BASE[cfg.defects]*rand(.7,1.4)):1e12; }
if(!cfg.defects) defectT=1e12;

/* ---- eventos de mercado ---- */
const reactions=[]; let lastIb=0,lastUs=0;
function marketEvents(){
  const bi=D.ibovPct>=1?1:D.ibovPct<=-1?-1:0;
  if(bi!==lastIb){ if(!S.night){ if(bi===1) reactions.push({t:'cheer',text:'Bolsa em alta!'}); if(bi===-1) reactions.push({t:'sad',text:'Bolsa caiu...'}); } lastIb=bi; }
  const bu=D.usdPct>=1?1:D.usdPct<=-1?-1:0;
  if(bu!==lastUs){ if(bu===1&&!S.night&&!byId.dolar.defect) spawnDefect('heat',byId.dolar);
    if(bu===-1&&!S.night) reactions.push({t:'cheer',text:'Dólar em queda!'}); lastUs=bu; }
}
let simStep=0;
function simTick(){
  const k=simStep++%4;
  // Ibovespa continua simulado (não há API gratuita sem chave); dólar e clima viram reais com ?real=1;
  // a sala vira real com ?sensors=URL
  if(k===0){ D.ibovPct=clamp(D.ibovPct*.88+rand(-.5,.5),-3.5,3.5); D.ibov=IBOV0*(1+D.ibovPct/100); }
  if(k===1&&!REAL){ D.usdPct=clamp(D.usdPct*.88+rand(-.5,.5),-3.5,3.5); D.usd=USD0*(1+D.usdPct/100); }
  if(k===2&&!SENSOR_URL){ if(force.room===null) D.tRoom+=(23.4-D.tRoom)*.15+rand(-.25,.25); D.hum=clamp(D.hum+rand(-1.5,1.5),35,85); D.press+=rand(-.7,.7); }
  if(k===3&&!REAL){ D.tOut+=rand(-.4,.4); }
  renderData(); marketEvents();
}

/* ============================ MONITOR DO PI ============================ */
const STATS_URL=Q.get('stats')||(location.protocol.indexOf('http')===0?'/api/stats':null);   // servido por stats_server.py
const PI={src:'off',t:null,cpu:null,ram:null,ramUsed:null,ramTot:null,disk:null,up:null,load:null,ip:'',host:'',thr:0};
let forcePi=null; const cpuHist=[];
function simPi(){
  PI.src='sim'; PI.t=clamp((PI.t==null?48:PI.t)+rand(-1.2,1.2),42,62); PI.cpu=clamp((PI.cpu==null?20:PI.cpu)+rand(-12,12),3,85);
  PI.ram=clamp((PI.ram==null?38:PI.ram)+rand(-1.5,1.5),25,70); PI.ramTot=3800; PI.ramUsed=PI.ram/100*3800;
  PI.disk=42; PI.up=(PI.up||86400)+2; PI.load=PI.cpu/25; PI.ip='simulado'; PI.host='—'; PI.thr=0;
}
async function pollPi(){
  if(!STATS_URL) simPi();
  else{
    try{
      const r=await fetch(STATS_URL,{cache:'no-store'}), j=await r.json();
      if(j.temp==null&&j.cpu==null) throw new Error('sem dados');
      PI.src=j.sim?'sim':'live'; PI.t=j.temp; PI.cpu=j.cpu; PI.ram=j.ram_pct; PI.ramUsed=j.ram_used_mb; PI.ramTot=j.ram_total_mb;
      PI.disk=j.disk_pct; PI.up=j.uptime_s; PI.load=j.load1; PI.ip=j.ip||''; PI.host=j.host||''; PI.thr=j.throttled||0;
    }catch(e){ PI.src='off'; }
  }
  if(forcePi!=null){ PI.t=forcePi; if(PI.src==='off') PI.src='sim'; }
  if(PI.cpu!=null&&PI.src!=='off'){ cpuHist.push(PI.cpu); if(cpuHist.length>60) cpuHist.shift(); }
  piState(); renderPi();
}
function piState(){
  if(PI.t==null||PI.src==='off'){ S.piHot=false; return; }   // sem leitura, não segura o cooler ligado
  if(!S.piHot&&PI.t>=70) S.piHot=true; else if(S.piHot&&PI.t<=62) S.piHot=false;   // histerese: liga a 70°C, desliga a 62°C
}
const lvl=(v,a,b)=>v>=b?'#ff6b5e':v>=a?'#ffc857':'#5cf5d2';
const fmtUp=s=>{ if(s==null) return '-'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?`${d}d ${h}h`:`${h}h ${m}m`; };
const gb=mb=>(mb/1024).toFixed(1);
function thrText(v){
  const a=[]; if(v&1) a.push('sub-tensão agora'); if(v&4) a.push('CPU limitada agora'); if(v&8) a.push('limite de temperatura');
  if(!a.length&&(v&0x50000)) a.push('já houve sub-tensão/limite');
  return a.length?a.join(', '):'ok';
}
function renderPi(){
  const ok=PI.src!=='off', hasT=ok&&PI.t!=null;
  $('piDot').setAttribute('fill',PI.src==='live'?'#37d67a':PI.src==='sim'?'#ffc857':'#ff4a3a');
  const row=(k,v,pct,a,b,txt)=>{ const bar=$('bar'+k); if(!ok||v==null){ bar.setAttribute('width',0); $('pi'+k).textContent='--'; return; }
    bar.setAttribute('width',(70*clamp(pct,0,1)).toFixed(1)); bar.setAttribute('fill',lvl(v,a,b)); $('pi'+k).textContent=txt; };
  row('T',PI.t,(PI.t-30)/55,65,78,`${Math.round(PI.t)}°C`);
  row('C',PI.cpu,(PI.cpu||0)/100,70,90,`${Math.round(PI.cpu)}%`);
  row('R',PI.ram,(PI.ram||0)/100,75,90,`${Math.round(PI.ram)}%`);
  $('piF').textContent=ok?`${fmtUp(PI.up)} · ${gb(PI.ramUsed)}/${gb(PI.ramTot)} GB`:'sem dados — servidor offline?';
  const g=$('cpuGlow'); g.setAttribute('opacity',hasT&&PI.t>=70?1:0); g.setAttribute('stroke',PI.t>=78?'#ff5a3c':'#ffc857');
  if(cpuHist.length>1){ const st=148/59, x0=326+(60-cpuHist.length)*st;
    $('piSpark').setAttribute('d','M'+cpuHist.map((v,i)=>`${(x0+i*st).toFixed(1)},${(85-clamp(v,0,100)/100*18).toFixed(1)}`).join(' L')); }
  if(!$('tab-sys').hidden){
    $('sSrc').textContent=PI.src==='live'?'ao vivo':PI.src==='sim'?'simulado':'sem conexão'; $('sSrc').style.color=PI.src==='live'?'#37d67a':PI.src==='sim'?'#ffc857':'#ff6b5e';
    $('sT').textContent=hasT?`${PI.t.toFixed(1)} °C`:'sem sensor'; $('sT').style.color=hasT?lvl(PI.t,65,78):'';
    $('sC').textContent=ok&&PI.cpu!=null?`${PI.cpu.toFixed(0)} %`:'-';
    $('sR').textContent=ok&&PI.ram!=null?`${gb(PI.ramUsed)} / ${gb(PI.ramTot)} GB (${PI.ram.toFixed(0)}%)`:'-';
    $('sD').textContent=ok&&PI.disk!=null?`${PI.disk.toFixed(0)} % usado`:'-';
    $('sL').textContent=ok&&PI.load!=null?PI.load.toFixed(2):'-';
    $('sU').textContent=ok?fmtUp(PI.up):'-';
    $('sI').textContent=ok?(PI.ip+(PI.host&&PI.host!=='—'?` · ${PI.host}`:'')):'-';
    $('sP').textContent=ok?thrText(PI.thr):'-'; $('sP').style.color=ok&&PI.thr&5?'#ff6b5e':'';
    $('sF').textContent=fan.on?'ligado':'desligado';
  }
}

/* ============================ PLATAFORMAS ============================ */
function surf(id){
  if(id==='G') return {y:GY,x1:20,x2:780};
  const c=byId[id]; return {y:c.y,x1:c.x+8,x2:c.x+CW-8};
}
function surfsOf(layout){
  const m={G:{id:'G',y:GY,x1:20,x2:780}};
  layout.forEach((col,i)=>{ if(col.length){ const c=col[col.length-1]; m[c.id]={id:c.id,y:BASE-CH*col.length,x1:homeX(i)+8,x2:homeX(i)+CW-8}; } });
  return m;
}
const nodes=()=>surfsOf(cols);
function canGo(a,b){
  if(b.id==='G') return true;
  if(a.id==='G') return (GY-b.y)<=JUMP_UP;
  const gap=Math.max(b.x1-a.x2,a.x1-b.x2,0);
  return gap<=JUMP_GAP && (a.y-b.y)<=JUMP_UP;
}
function bfs(m,from,to){
  if(!m[from]) return null; if(from===to) return [];
  const prev={[from]:null}, q=[from];
  while(q.length){ const u=q.shift(); if(u===to) break;
    for(const v in m){ if(prev[v]===undefined && canGo(m[u],m[v])){ prev[v]=u; q.push(v); } } }
  if(prev[to]===undefined) return null;
  const path=[]; let c=to; while(c!==from){ path.unshift(c); c=prev[c]; } return path;
}
const planPath=(from,to)=>{ const m=nodes(); if(!m[to]) return null; return bfs(m,from,to); };
const layoutOK=layout=>{ const m=surfsOf(layout); return Object.keys(m).every(k=>k==='G'||bfs(m,'G',k)!==null); };

/* ============================ ROBÔ ============================ */
const bot={x:420,y:GY,plat:'G',dest:null,lcx:0,face:1,pose:'idle',mood:'neutral',moodUntil:0,low:false,carry:false,tip:null,
  task:null,name:'',t:0,blinkT:2000,blinkOn:false,look:0,drag:null,escaping:false,squash:0,wake:false};
const setMood=(m,ms)=>{bot.mood=m;bot.moodUntil=now+ms;};
let bubbleUntil=0;
function say(text,ms=2200){ const b=$('bubble'); b.textContent=text; b.classList.add('on'); bubbleUntil=now+ms; }

function follow(){
  if(bot.plat==='G'){ bot.y=GY; }
  else if(bot.plat){ const c=byId[bot.plat]; bot.x+=c.x-bot.lcx; bot.lcx=c.x; bot.y=c.y; }
}
const isRiding=()=>{ const c=byId[bot.plat]; return !!c&&c.mode==='carried'; };
function landOn(id,x){
  if(id!=='G'){ const c=byId[id];
    if(c.mode!=='carried'&&!isTop(c)){ const col=cols.find(cc=>cc.includes(c)); if(col&&col.length) id=col[col.length-1].id; } }
  bot.plat=id; bot.dest=null; bot.pose='idle'; bot.squash=1;
  const s=surf(id); bot.y=s.y; bot.x=clamp(x!=null?x:bot.x,s.x1,s.x2);
  if(id!=='G') bot.lcx=byId[id].x;
}
function setTask(gen,name){
  if(bot.task){ try{ bot.task.return(); }catch(e){} }
  bot.task=(function*(){ yield* ensureGround(); yield* gen; })(); bot.name=name||''; bot.escaping=false; bot.dest=null;
}
function* ensureGround(){ if(bot.plat===null) yield* fall(); }
function* wait(ms){ let t=0; while(t<ms){ t+=dt; yield; } }
function* walkTo(x,speed=58){
  const s=surf(bot.plat); x=clamp(x,s.x1,s.x2);
  bot.pose='walk';
  while(Math.abs(x-bot.x)>1.5){
    const d=Math.sign(x-bot.x); bot.face=d;
    bot.x+=d*Math.min(speed*dt/1000,Math.abs(x-bot.x));
    yield;
    if(bot.plat===null) break;
  }
  bot.pose='idle';
}
function* jumpTo(id,xl){
  const tg=()=>{ const s=surf(id); return {x:clamp(xl,s.x1,s.x2),y:s.y}; };
  const x0=bot.x,y0=bot.y; let g=tg();
  const dist=Math.hypot(g.x-x0,g.y-y0), dur=420+dist*1.7, h=30+Math.max(0,y0-g.y)*.55;
  bot.plat=null; bot.dest=id; bot.pose='jump'; bot.face=Math.sign(g.x-x0)||bot.face;
  let t=0;
  while(t<dur){ t+=dt; const s=Math.min(1,t/dur); g=tg(); bot.x=x0+(g.x-x0)*s; bot.y=y0+(g.y-y0)*s-4*h*s*(1-s); yield; }
  landOn(id,g.x);
}
function* fall(){
  bot.pose='jump'; let vy=0;
  for(;;){
    vy+=2200*dt/1000; const ny=bot.y+vy*dt/1000, m=nodes(); let land=null;
    for(const k in m){ if(k==='G') continue; const s=m[k];
      if(bot.x>=s.x1&&bot.x<=s.x2&&s.y>=bot.y-1&&s.y<=ny&&(!land||s.y<m[land].y)) land=k; }
    if(land){ landOn(land,bot.x); return; }
    if(ny>=GY){ landOn('G',bot.x); return; }
    bot.y=ny; yield;
  }
}
function* goTo(id,x){
  const path=planPath(bot.plat,id); if(!path) return false;
  for(const n of path){
    const a=surf(bot.plat), b=surf(n); let lx,ax;
    if(n==='G'){ const toward=(x!=null)?(x<bot.x):((bot.x-a.x1)<(a.x2-bot.x));
      lx=toward?a.x1:a.x2; ax=clamp(lx+(toward?-24:24),24,776); }
    else if(bot.plat==='G'){ lx=clamp(bot.x,b.x1-40,b.x2+40); ax=clamp(lx,b.x1+12,b.x2-12); }
    else if(b.x1>a.x2){ lx=a.x2-6; ax=b.x1+12; } else { lx=a.x1+6; ax=b.x2-12; }
    yield* walkTo(lx);
    yield* jumpTo(n,ax);
  }
  if(x!=null) yield* walkTo(x);
  return true;
}

/* ---- equipamento (notebook + caixa de ferramentas) ---- */
const WK={on:false,plat:'G',ox:0,gx:0,x:0,y:0,k:0,open:0,prog:0,cable:false,tools:false,card:null,face:1};
function* setupGear(c){
  bot.carry=false; bot.pose='setup';
  WK.on=true; WK.card=c; WK.plat=bot.plat; WK.face=bot.face; WK.k=0; WK.open=0; WK.lidK=0; WK.prog=0; WK.cable=false; WK.tools=false;
  const wx=bot.x+bot.face*28;
  if(bot.plat==='G') WK.gx=wx; else WK.ox=wx-byId[bot.plat].x;
  yield* wait(700);
}
function* packGear(){ WK.open=0; WK.cable=false; WK.tools=false; bot.pose='setup'; yield* wait(550); WK.on=false; }
function endGear(){ WK.on=false; bot.carry=false; }
function* typeFor(c,ms,from,to){
  bot.pose='type'; WK.open=1; WK.cable=!!c; let t=0;
  while(t<ms){ t+=dt; const p=from+(to-from)*Math.min(1,t/ms); if(c){ c.rep=p; } WK.prog=p; yield; }
}
function* toolWork(c,type,ms){
  WK.tools=true; WK.open=0; WK.cable=false; bot.pose=type==='short'?'solder':'work'; let t=0;
  while(t<ms){ t+=dt; if(type!=='short'&&Math.floor(t/340)!==Math.floor((t-dt)/340)){ c.fx=1; }
    c.rep=.5*Math.min(1,t/ms); WK.prog=c.rep; yield; }
}
function* fixCard(c){
  if(c.fixing||c.mode==='carried'||!c.defect) return;
  c.fixing=true; c.el.classList.add('fixing'); bot.low=false;
  try{
    setMood('worried',1400); say(`Defeito no ${c.label}: ${DEFNAME[c.defect]}`,2600); bot.carry=true;
    const top=isTop(c), id=top?c.id:'G';
    const x=top?clamp(c.tx+CW/2-30,c.tx+34,c.tx+CW-80):clamp(c.tx+CW/2-30,50,690);
    if(!(yield* goTo(id,x))) return;
    bot.face=1; yield* setupGear(c);
    const kind=DEFKIND[c.defect];
    if(kind==='hw'){
      yield* toolWork(c,c.defect,3600);
      yield* typeFor(c,2600,.5,1);
    } else {
      if(c.defect==='bug'){ bot.pose='work'; WK.tools=true; for(let i=0;i<4;i++){ yield* wait(330); c.fx=1; } WK.tools=false; }
      yield* typeFor(c,4600,0,1);
    }
    c.rep=1; yield* wait(300);
    setDefect(c,null); c.el.classList.add('ok'); setTimeout(()=>c.el.classList.remove('ok'),1400); doFlash(c);
    yield* packGear();
    bot.pose='cheer'; setMood('happy',2000); say('Resolvido!',1800); yield* wait(1300);
  } finally {
    endGear(); c.fixing=false; c.el.classList.remove('fixing');
  }
}

/* ---- atividades ---- */
function* wander(){
  bot.low=true;
  const m=nodes(), id=pick(Object.keys(m)), s=m[id];
  yield* goTo(id,id==='G'?rand(100,700):rand(s.x1+10,s.x2-10)); yield* wait(rand(600,1800));
}
function* attend(c){
  bot.low=true; if(c.mode==='carried'||c.defect) return;
  const top=isTop(c), id=top?c.id:'G';
  const x=top?rand(c.tx+30,c.tx+CW-30):clamp(c.tx+CW/2+rand(-40,40),60,700);
  if(!(yield* goTo(id,x))) return;
  bot.pose='work'; bot.face=bot.x<c.x+CW/2?1:-1;
  for(let i=0;i<3;i++){ yield* wait(330); c.fx=1; doFlash(c); }
  bot.pose='idle'; c.check=false; setMood('happy',1200); yield* wait(400);
}
function* sitRoutine(){
  bot.low=true;
  const ids=Object.keys(nodes()).filter(k=>k!=='G'); if(!ids.length) return;
  const id=pick(ids), c=byId[id], side=Math.random()<.5?-1:1;
  if(!(yield* goTo(id,side>0?c.tx+CW-8:c.tx+8))) return;
  bot.face=side; bot.pose='sit'; yield* wait(rand(6000,10000)); bot.pose='idle';
}
function* lookAround(){
  bot.low=true; bot.pose='idle';
  for(let i=0;i<3;i++){ bot.look=pick([-2,0,2]); if(Math.random()<.3) bot.face*=-1; yield* wait(rand(700,1400)); }
  bot.look=0;
}
function* signalCrane(){            // o bot abre o notebook e comanda o guindaste
  bot.low=true;
  try{
    yield* setupGear(null); bot.pose='type'; WK.open=1; say('Reorganizando os módulos…',2600);
    yield* wait(2200); crane.req=true; yield* wait(700); yield* packGear(); bot.pose='idle';
  } finally { endGear(); }
}
function* fanRoutine(on,why){
  if(!(yield* goTo('G',738))) return;
  bot.face=1; bot.pose='press'; say(on?(why==='pi'?'O Pi está esquentando! Ligando o cooler':'Ufa! Ligando o cooler'):'Já deu uma refrescada',2800);
  yield* wait(750); setFan(on); bot.pose='idle'; setMood(on?'happy':'neutral',2500); yield* wait(on?5000:800);
}
function* warmRoutine(){
  bot.low=true;
  if(!(yield* goTo('G',84))) return;
  bot.face=-1; bot.pose='warm'; say('Brrr... esse resistor aquece bem',2600);
  yield* wait(rand(7000,11000)); bot.pose='idle';
}
function* sleepRoutine(){
  const m=nodes(), ids=Object.keys(m).filter(k=>k!=='G').sort((a,b)=>m[a].y-m[b].y);
  for(const id of ids){ if(planPath(bot.plat,id)){ yield* goTo(id,(m[id].x1+m[id].x2)/2); break; } }
  bot.pose='sleep'; bot.face=1; bot.wake=false;
  while(S.night){
    if(bot.wake){ bot.pose='idle'; setMood('surprised',1500); say('Hã? Tô acordado!',2000); yield* wait(4000); bot.wake=false; bot.pose='sleep'; }
    yield;
  }
  bot.pose='cheer'; say('Bom dia!',2600); yield* wait(1600); bot.pose='idle';
}
function* react(r){
  if(r.t==='cheer'){ bot.pose='cheer'; setMood('happy',3600); say(r.text,3000); yield* wait(3600); }
  else if(r.t==='sad'){ bot.pose='sad'; setMood('sad',4200); say(r.text,3000); yield* wait(4200); }
  else { bot.pose='idle'; setMood('worried',3000); say(r.text,3000); yield* wait(2400); }
  bot.pose='idle';
}
function* escapeFrom(id){
  bot.escaping=true; setMood('surprised',1000); say('Opa! Braço robótico!',1600);
  const m=nodes(); let best=null,bl=99;
  for(const k in m){ if(k===id||(crane.carry&&k===crane.carry.id)) continue;
    const p=planPath(bot.plat,k); if(p&&p.length&&p.length<bl){ best=k; bl=p.length; } }
  yield* goTo(best||'G',null); bot.escaping=false;
}
const craneIdleOK=()=>!crane.task&&!crane.req&&(now-crane.last)>70000;

function* think(){
  bot.pose='idle'; bot.low=false;
  if(S.night) return yield* sleepRoutine();
  if(isRiding()){ yield* wait(400); return; }
  const bad=cards.find(c=>c.defect&&!c.fixing&&c.mode!=='carried');
  if(bad) return yield* fixCard(bad);
  const wantFan=S.hot||S.piHot;
  if(wantFan&&!fan.on) return yield* fanRoutine(true,S.piHot&&!S.hot?'pi':'sala');
  if(!wantFan&&fan.on) return yield* fanRoutine(false);
  if(reactions.length) return yield* react(reactions.shift());
  if(S.cold&&Math.random()<.35) return yield* warmRoutine();
  const chk=cards.filter(c=>c.check&&!c.defect);
  if(chk.length&&Math.random()<.6) return yield* attend(pick(chk));
  const r=Math.random();
  if(r<.36) return yield* wander();
  if(r<.52) return yield* attend(pick(cards.filter(c=>!c.defect)));
  if(r<.68) return yield* sitRoutine();
  if(r<.80&&craneIdleOK()) return yield* signalCrane();
  return yield* lookAround();
}
function runBot(){
  if(bot.drag) return;
  follow();
  if(crane.evictId!=null&&bot.plat===crane.evictId&&!bot.escaping){ setTask(escapeFrom(crane.evictId),'escape'); bot.escaping=true; }
  if(!bot.task){ setTask(think(),'think'); }
  const r=bot.task.next(); if(r.done) bot.task=null;
}

/* ============================ GUINDASTE (braço pick-and-place) ============================ */
const crane={x:400,hy:26,carry:null,task:null,req:false,active:false,last:0,evictId:null,lastCard:null};
function syncCarry(){ const c=crane.carry; if(c){ c.x=crane.x-CW/2; c.y=crane.hy+10; c.tx=c.x; c.ty=c.y; } }
function* craneMove(tx,sp=170){ while(Math.abs(crane.x-tx)>1){ crane.x+=Math.sign(tx-crane.x)*Math.min(sp*dt/1000,Math.abs(tx-crane.x)); syncCarry(); yield; } }
function* craneLower(ty,T,sp=125){
  while(Math.abs(crane.hy-ty)>1){
    if(T&&(bot.plat===T.id||bot.dest===T.id)){ crane.evictId=T.id; yield; continue; }
    crane.hy+=Math.sign(ty-crane.hy)*Math.min(sp*dt/1000,Math.abs(ty-crane.hy)); syncCarry(); yield;
  }
}
function pickMove(){
  const cand=[];
  for(let a=0;a<cols.length;a++){ if(!cols[a].length) continue;
    for(let b=0;b<cols.length;b++){ if(b===a||cols[b].length>1) continue;
      const l2=cols.map(c=>c.slice()), card=l2[a].pop(); l2[b].push(card);
      if(layoutOK(l2)) cand.push({card,from:a,to:b}); } }
  if(!cand.length) return null;
  const fresh=cand.filter(m=>m.card!==crane.lastCard);

function* craneRoutine(mv){
  const {card,from,to}=mv;
  yield* craneMove(card.x+CW/2);
  yield* craneLower(card.y-10,null);
  cols[from].pop(); card.mode='carried'; crane.carry=card; crane.lastCard=card;
  yield* wait(250);
  yield* craneLower(26,null);
  yield* craneMove(slotCx(to));
  const T=cols[to].length?cols[to][cols[to].length-1]:null;
  yield* craneLower(homeY(cols[to].length)-10,T);
  crane.evictId=null;
  cols[to].push(card); card.mode='free'; crane.carry=null;
  card.tx=homeX(to); card.ty=homeY(cols[to].length-1); card.x=card.tx; card.y=card.ty; card.bump=1;
  yield* wait(350);
  yield* craneLower(26,null);
  yield* craneMove(rand(160,640),120);
}
function runCrane(){
  if(!crane.task&&crane.req){ crane.req=false; crane.last=now;
    if(!S.night){ const mv=pickMove(); if(mv){ crane.task=craneRoutine(mv); crane.active=true; } } }
  if(crane.task){ const r=crane.task.next(); if(r.done){ crane.task=null; crane.active=false; crane.evictId=null; crane.last=now; } }
}

}

function stagePt(e){ const r=stage.getBoundingClientRect(); return {x:(e.clientX-r.left)/(r.width/W),y:(e.clientY-r.top)/(r.height/H)}; }
const goFull=()=>{ const el=document.documentElement; try{ if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(e){} };
if(KIOSK) addEventListener('pointerdown',()=>{ if(!document.fullscreenElement&&document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); },{once:true});

cards.forEach(c=>c.el.addEventListener('pointerup',()=>{
  if(bot.drag||c.mode==='carried') return;
  bot.wake=true; doFlash(c);
  setTask(c.defect?fixCard(c):attend(c),'tap');
}));
$('ground').addEventListener('pointerdown',e=>{
  if(bot.drag) return; const p=stagePt(e); bot.wake=true;
  setTask((function*(){ yield* goTo('G',clamp(p.x,30,770)); })(),'tap');
});
const hit=$('botHit');
hit.addEventListener('pointerdown',e=>{
  e.preventDefault(); hit.setPointerCapture(e.pointerId); const p=stagePt(e);
  bot.drag={sx:p.x,sy:p.y,moved:false,ox:bot.x-p.x,oy:bot.y-p.y};
});
hit.addEventListener('pointermove',e=>{
  const d=bot.drag; if(!d) return; const p=stagePt(e);
  if(!d.moved&&Math.hypot(p.x-d.sx,p.y-d.sy)>6){ d.moved=true; if(bot.task){ try{bot.task.return();}catch(_){} } bot.plat=null; bot.dest=null; bot.task=null; bot.pose='drag'; say('Ei!',1500); }
  if(d.moved){ bot.x=clamp(p.x+d.ox,12,788); bot.y=clamp(p.y+d.oy,90,GY); }
});
const endDrag=()=>{
  const d=bot.drag; if(!d) return; bot.drag=null;
  if(d.moved) setTask((function*(){ yield* wait(1); })(),'drop');
  else setTask((function*(){ bot.pose='cheer'; setMood('happy',1500); say('hehe',1500); yield* wait(1300); bot.pose='idle'; })(),'pet');
};
hit.addEventListener('pointerup',endDrag); hit.addEventListener('pointercancel',endDrag);

/* ============================ SETUP ============================ */
const p2=n=>String(n).padStart(2,'0');
function renderSetup(){
  $('sleepOn').textContent=cfg.sleepOn?'Ligado':'Desligado'; $('sleepOn').classList.toggle('on',cfg.sleepOn);
  document.querySelectorAll('#panel .grp[data-k]').forEach(g=>{
    const v=cfg[g.dataset.k]; g.querySelector('.hh').textContent=p2(Math.floor(v/60)); g.querySelector('.mm').textContent=p2(v%60); });
  document.querySelectorAll('#skinGrp button').forEach(b=>b.classList.toggle('on',b.dataset.skin===cfg.skin));
  document.querySelectorAll('#defGrp button').forEach(b=>b.classList.toggle('on',+b.dataset.def===cfg.defects));
  $('botSvg').setAttribute('class','layer skin-'+cfg.skin);
}
$('sleepOn').addEventListener('click',()=>{ cfg.sleepOn=!cfg.sleepOn; saveCfg(); renderSetup(); updateState(); });
document.querySelectorAll('#panel .grp[data-k] button').forEach(b=>b.addEventListener('click',()=>{
  const k=b.parentNode.dataset.k, v=cfg[k], h=Math.floor(v/60), m=v%60, d=+b.dataset.d;
  cfg[k]= b.dataset.u==='h' ? ((h+d+24)%24)*60+m : h*60+((m+d+60)%60);
  saveCfg(); renderSetup(); updateState();
}));
document.querySelectorAll('#skinGrp button').forEach(b=>b.addEventListener('click',()=>{ cfg.skin=b.dataset.skin; saveCfg(); renderSetup(); }));
document.querySelectorAll('#defGrp button').forEach(b=>b.addEventListener('click',()=>{ cfg.defects=+b.dataset.def; saveCfg(); resetDefectTimer(true); renderSetup(); }));
$('fsBtn').addEventListener('click',goFull);
$('gear').addEventListener('click',()=>{ $('panel').hidden=!$('panel').hidden; renderSetup(); });
$('closeP').addEventListener('click',()=>{ $('panel').hidden=true; });
document.querySelectorAll('#panel [data-tab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#panel [data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  ['setup','sys','test'].forEach(k=>{ $('tab-'+k).hidden=b.dataset.tab!==k; }); renderPi();
}));
addEventListener('keydown',e=>{ if(e.key==='d'||e.key==='D'){ $('panel').hidden=!$('panel').hidden; renderSetup(); } if(e.key==='f'||e.key==='F') goFull(); });
const act={
  cold(){force.room=15.5;D.tRoom=15.5;}, hot(){force.room=30;D.tRoom=30;}, mild(){force.room=null;D.tRoom=23.4;},
  rain(){D.cond='chuva';D.rain=90;}, sun(){D.cond='sol';D.rain=10;},
  night(){force.night=true;}, day(){force.night=false;}, auto(){force.night=null;},
  ibovUp(){lastIb=0;D.ibovPct=1.8;D.ibov=IBOV0*(1+D.ibovPct/100);}, ibovDown(){lastIb=0;D.ibovPct=-1.9;D.ibov=IBOV0*(1+D.ibovPct/100);},
  usdUp(){lastUs=0;D.usdPct=1.6;D.usd=USD0*(1+D.usdPct/100);}, usdDown(){lastUs=0;D.usdPct=-1.4;D.usd=USD0*(1+D.usdPct/100);},
  crane(){crane.req=true;},
  piHot(){forcePi=78;PI.t=78;if(PI.src==='off')PI.src='sim';}, piOk(){forcePi=null;},
  glitch(){spawnDefect('glitch');}, heat(){spawnDefect('heat');}, short(){spawnDefect('short');}, bsod(){spawnDefect('bsod');}, bug(){spawnDefect('bug');}
};
$('tab-test').addEventListener('click',e=>{
  const a=e.target.dataset&&e.target.dataset.a; if(!a||!act[a]) return;
  act[a](); updateState(); renderData(); marketEvents(); piState(); renderPi();
});

/* ============================ LOOP ============================ */
let acc=0,boardAcc=0,simAcc=0,last=0;
function step(ms){
  dt=ms; now+=ms;
  acc+=ms; if(acc>=1000){ acc-=1000; renderClock(); updateState(); }
  boardAcc+=ms; if(boardAcc>=250){ boardAcc=0; updateBoard(); }
  simAcc+=ms; if(simAcc>=9000){ simAcc=0; simTick(); }
  defectT-=ms; if(defectT<=0){ resetDefectTimer(false); if(!S.night&&cards.filter(c=>c.defect).length<2) spawnDefect(); }
  runCrane(); runBot(); emitFx(); renderCards(); renderCrane(); renderWork(); renderBot(); renderFx();
  $('heater').classList.toggle('on',S.cold||bot.pose==='warm');
}
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts; const el=ts-last; if(el<30) return;
  last=ts; step(Math.min(el,60));
}
updateState(); S.nightness=S.night?1:0; renderClock(); renderData(); renderSetup(); updateBoard(); resetDefectTimer(true);
setTask(think(),'think');
pollPi(); setInterval(pollPi,2000);
if(REAL){ loadReal(); setInterval(loadReal,10*60*1000); }
if(SENSOR_URL){ loadSensors(); setInterval(loadSensors,10000); }
requestAnimationFrame(frame);

window.__rebite={PI,pollPi,renderPi,step,bot,crane,cards,cols,S,D,force,fan,act,nodes,layoutOK,setTask,reactions,isTop,cfg,WK,P,spawnDefect,updateState};
})();
</script>
